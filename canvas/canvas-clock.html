<!DOCTYPE html>
<html>
    <head>
        <title>Clock</title>
    </head>
    <body>

        <div class="middle">
            <canvas id="canvas" width="1000" height="1000" style="background-color:#333">Sorry, your browser does not support canvas.</canvas>
            <input type="radio" id="sample" name="mode" value="sample">
            <label for="sample">10:08:37</label>
            <input type="radio" id="live" name="mode" value="live" checked>
            <label for="live">Live Time</label>
        </div>

        <script>
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            let radius = canvas.height / 2;
            ctx.translate(radius, radius);
            radius = radius * 0.90
            setInterval(drawClock, 1000);

            function drawClock() {
                drawFace(ctx, radius);
                drawNumbers(ctx, radius);
                drawTicks();
                drawTime(ctx, radius);
            }

            function drawFace(ctx, radius) {
                const grad = ctx.createRadialGradient(0,0,radius*0.95, 0,0,radius*1.05);
                grad.addColorStop(0, '#333');
                grad.addColorStop(0.5, 'white');
                grad.addColorStop(1, '#333');
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, 2*Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = grad;
                ctx.lineWidth = radius*0.1;
                ctx.stroke();
            }

            function drawNumbers(ctx, radius) {
                ctx.font = radius*0.15 + "px arial";
                ctx.textBaseline="middle";
                ctx.textAlign="center";
                ctx.fillStyle = "#333";
                let romanTable = {
                    3: "III",
                    6: "VI",
                    9: "IX",
                    12: "XII"
                }
                for(let num = 3; num <= 12; num+=3){
                    let ang = num * Math.PI / 6;
                    ctx.rotate(ang);
                    ctx.translate(0, -radius*0.75);
                    ctx.rotate(-ang);
                    ctx.fillText(romanTable[num], 0, 0);
                    ctx.rotate(ang);
                    ctx.translate(0, radius*0.75);
                    ctx.rotate(-ang);
                }
            }

            function drawTicks(){
                for (let i=0; i < 60; i++){
                    let ang = i * Math.PI / 30;
                    let isHour = i % 5 ===0;
                    let tickLength = isHour ? radius * 0.08 : radius * 0.04;
                    let tickWidth = isHour ? radius * 0.02 : radius * 0.008;

                    ctx.beginPath();
                    ctx.lineWidth = tickWidth;
                    ctx.lineCap = "round";
                    ctx.strokeStyle = "#333";

                    ctx.rotate(ang);
                    ctx.moveTo(0, -radius * 0.94);
                    ctx.lineTo(0, -radius * 0.94 + tickLength);
                    ctx.stroke();
                    ctx.rotate(-ang);
                }
            }

            function drawTime(ctx, radius) {
                const mode = document.querySelector('input[name="mode"]:checked').value;
                let hour, minute, second;

                if (mode === "sample") {
                    hour = 10;
                    minute = 8;
                    second = 37;
                } else {
                    const now = new Date();
                    hour = now.getHours();
                    minute = now.getMinutes();
                    second = now.getSeconds();
                }

                // draw the digits
                // Format as HH:MM:SS (place this right after getting hour, minute, second)
                const timeText = [
                    String(hour).padStart(2, "0"),
                    String(minute).padStart(2, "0"),
                    String(second).padStart(2, "0")
                ].join(":");

                // Draw simple box + text below center (before drawing hands)
                const boxW = radius * 0.56;
                const boxH = radius * 0.16;
                const boxY = radius * 0.32;

                ctx.fillStyle = '#eee';
                ctx.fillRect(-boxW / 2, boxY, boxW, boxH);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(-boxW / 2, boxY, boxW, boxH);

                ctx.font = (radius * 0.1) + "px monospace";
                ctx.fillStyle = '#333';
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(timeText, 0, boxY + boxH / 2);

                // Hour hand (wider, shorter)
                hour = hour % 12;
                hour = (hour * Math.PI / 6) +
                        (minute * Math.PI / (6 * 60)) +
                        (second * Math.PI / (360 * 60));
                drawFacetedHand(ctx, hour, radius * 0.55, radius * 0.055);

                // Minute hand (narrower, longer)
                minute = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
                drawFacetedHand(ctx, minute, radius * 0.82, radius * 0.038);

                // Second hand (with counterweight)
                second = (second * Math.PI / 30);
                drawSecondHand(ctx, second, radius);

                // Center cap (drawn last to sit on top of the hands)
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
                ctx.fillStyle = '#333';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.02, 0, 2 * Math.PI);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            function drawFacetedHand(ctx, pos, length, width) {
                ctx.save();
                ctx.rotate(pos);

                const tail = length * 0.16;
                const shoulder = -length * 0.18;

                // Left facet
                ctx.beginPath();
                ctx.moveTo(0, tail);
                ctx.lineTo(-width, shoulder);
                ctx.lineTo(0, -length);
                ctx.closePath();
                ctx.fillStyle = '#555'; // Lighter facet placeholder
                ctx.fill();

                // Right facet
                ctx.beginPath();
                ctx.moveTo(0, tail);
                ctx.lineTo(width, shoulder);
                ctx.lineTo(0, -length);
                ctx.closePath();
                ctx.fillStyle = '#222'; // Darker facet placeholder
                ctx.fill();

                ctx.restore();
                }

            function drawSecondHand(ctx, pos, radius) {
                ctx.save();
                ctx.rotate(pos);

                const tip = -radius * 0.88;
                const tailEnd = radius * 0.18;
                const ringRadius = radius * 0.035;

                // Main needle and tail
                ctx.beginPath();
                ctx.lineWidth = radius * 0.012;
                ctx.lineCap = "round";
                ctx.strokeStyle = '#666'; // Placeholder color
                ctx.moveTo(0, tailEnd);
                ctx.lineTo(0, tip);
                ctx.stroke();

                // Counterweight ring
                ctx.beginPath();
                ctx.arc(0, tailEnd + ringRadius, ringRadius, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.restore();
            }
        </script>

    </body>
</html>
